<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooking Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="header">
      <h1>🍳 Cooking Game</h1>
      <div class="stats">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat">
          <span class="label">Time</span>
          <span id="time">45</span>s
        </div>
      </div>
    </header>

    <section class="recipe-panel">
      <h2>Current Recipe</h2>
      <p id="recipe-name">Salad</p>
      <div id="recipe-ingredients" class="recipe-ingredients"></div>
    </section>

    <section class="ingredient-section">
      <h3>Select ingredients</h3>
      <div id="ingredients" class="ingredients">
        <button data-ingredient="lettuce">🥬 Lettuce</button>
        <button data-ingredient="tomato">🍅 Tomato</button>
        <button data-ingredient="carrot">🥕 Carrot</button>
        <button data-ingredient="cheese">🧀 Cheese</button>
        <button data-ingredient="dough">🥯 Dough</button>
        <button data-ingredient="patty">🥩 Patty</button>
        <button data-ingredient="bun">🍞 Bun</button>
        <button data-ingredient="onion">🧅 Onion</button>
        <button data-ingredient="water">💧 Water</button>
        <button data-ingredient="egg">🥚 Egg</button>
        <button data-ingredient="flour">🌾 Flour</button>
        <button data-ingredient="sugar">🍬 Sugar</button>
      </div>
    </section>

    <div class="selection-box">
      <h3>Selected ingredients</h3>
      <div id="selectedIngredients" class="selected">None selected</div>
    </div>

    <div class="buttons">
      <button id="cookButton" class="cook-button">🍳 Cook</button>
      <button id="restartButton" class="restart-button">Restart</button>
    </div>

    <p id="message" class="message"></p>
  </main>

  <script src="game.js"></script>
</body>
</html>
